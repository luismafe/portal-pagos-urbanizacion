spring.application.name=service-billing
server.port=8081

# Configuración PostgreSQL (coincide con docker-compose.yml)
spring.datasource.url=jdbc:postgresql://localhost:5432/urbanizacion_db
spring.datasource.username=admin
spring.datasource.password=secretpassword
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuración RabbitMQ (coincide con docker-compose.yml)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

