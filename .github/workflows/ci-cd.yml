name: CI/CD Pipeline - Urbanización Enterprise

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io

jobs:
  validate-and-build-backend:
    name: Validar y Compilar Backend (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend/service-billing

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compilar y empaquetar microservicio (Maven)
        run: mvn -B clean package -DskipTests

  validate-and-build-frontend:
    name: Validar y Compilar Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Construir bundle de producción
        run: npm run build -- --configuration production

  docker-build-and-deploy:
    name: Construir y Publicar Imágenes en GHCR (ghcr.io)
    needs: [validate-and-build-backend, validate-and-build-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión automáticamente en GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar imagen Docker del Backend (service-billing)
        run: |
          IMAGE_BACKEND=$(echo "${{ env.REGISTRY }}/${{ github.repository_owner }}/service-billing" | tr '[:upper:]' '[:lower:]')
          docker build -t $IMAGE_BACKEND:${{ github.sha }} -t $IMAGE_BACKEND:latest ./backend/service-billing
          docker push $IMAGE_BACKEND:${{ github.sha }}
          docker push $IMAGE_BACKEND:latest

      - name: Construir y publicar imagen Docker del Frontend (Angular + Nginx)
        run: |
          IMAGE_FRONTEND=$(echo "${{ env.REGISTRY }}/${{ github.repository_owner }}/frontend" | tr '[:upper:]' '[:lower:]')
          docker build -t $IMAGE_FRONTEND:${{ github.sha }} -t $IMAGE_FRONTEND:latest ./frontend
          docker push $IMAGE_FRONTEND:${{ github.sha }}
          docker push $IMAGE_FRONTEND:latest

      - name: Resumen de despliegue
        run: |
          echo "Imágenes publicadas exitosamente en ghcr.io/${{ github.repository_owner }} para el commit ${{ github.sha }}."
